<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>השתתפות בשמחה</title>
    <meta property="og:title" content="השתתפות בשמחה">
    <meta name="twitter:title" content="השתתפות בשמחה">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Optimized for Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Shared Theme & Styles -->
    <script src="frontend/theme.js"></script>
    <link rel="stylesheet" href="frontend/styles.css">
</head>
<body class="payment-body min-h-screen flex items-center justify-center font-sans p-4 relative text-gray-800">
    
    <!-- Decorative Ambient Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-rose-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-60"></div>
        <div class="absolute top-1/3 right-0 w-80 h-80 bg-yellow-100 rounded-full mix-blend-multiply filter blur-[100px] opacity-60 hidden md:block"></div>
        <div class="absolute -bottom-32 left-1/4 w-96 h-96 bg-purple-100 rounded-full mix-blend-multiply filter blur-[100px] opacity-50"></div>
    </div>

    <!-- The physical "Card" container -->
    <div class="relative w-full max-w-lg mt-8 mb-8">
        <!-- 3D Card Shadow Effect -->
        <div class="absolute inset-0 bg-gradient-to-tr from-wedding-gold/20 to-yellow-100/50 transform rotate-2 rounded-2xl md:rounded-[2rem] shadow-xl"></div>
        
        <!-- Main Card Surface -->
        <div class="relative bg-white shadow-2xl rounded-2xl md:rounded-[2rem] p-8 md:p-12 border border-wedding-gold/20 card-pattern overflow-hidden">
            
            <!-- Metallic Corner Decor -->
            <div class="absolute top-4 left-4 w-12 h-12 border-t-2 border-l-2 border-wedding-gold/30 rounded-tl-lg"></div>
            <div class="absolute top-4 right-4 w-12 h-12 border-t-2 border-r-2 border-wedding-gold/30 rounded-tr-lg"></div>
            <div class="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-wedding-gold/30 rounded-bl-lg"></div>
            <div class="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-wedding-gold/30 rounded-br-lg"></div>

            <!-- Card Header -->
            <div class="text-center mb-10">
                <h1 id="header-title" class="font-serif text-wedding-dark mb-4 drop-shadow-sm">
                    <span class="block text-2xl font-bold">החתונה של</span>
                    <span id="couple-names" class="block text-3xl font-bold mt-1"></span>
                </h1>
                
                <!-- Separator with Heart -->
                <div class="flex items-center justify-center gap-4">
                    <div class="h-[1px] w-16 bg-wedding-gold/40"></div>
                    <svg class="h-5 w-5 text-wedding-gold" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <div class="h-[1px] w-16 bg-wedding-gold/40"></div>
                </div>
            </div>

            <!-- Thank You Message & Intro -->
            <div class="text-center px-4 sm:px-8 md:px-10 mb-6 relative z-10 font-sans">
                <p class="text-xl sm:text-2xl font-semibold text-wedding-dark mb-2">
                    אורחים יקרים שלנו,
                </p>

                <p class="text-[1.05rem] sm:text-lg text-gray-700 leading-relaxed">
                    שמחים שבאתם לחגוג איתנו
                </p>
            </div>

            <!-- Payment Selection Buttons -->
            <div class="relative z-10 flex flex-col gap-4 mb-2">
                <button id="toggle-bank-btn" class="w-full bg-wedding-dark hover:bg-gray-900 text-white font-medium py-4 px-6 rounded-xl transition-all shadow-lg shadow-wedding-gold/10 flex items-center justify-center gap-3 border-2 border-wedding-gold/50 hover:border-wedding-gold/80">
                    <svg class="w-5 h-5 text-wedding-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    <span class="flex items-center">לחשבון הבנק <span class="text-wedding-gold/90 font-bold pr-1.5">(מועדף <span class="text-red-400">❤️</span>)</span></span>
                </button>
                <div id="bit-wrapper" class="hidden flex-col w-full">
                    <button id="bit-pay-btn" class="w-full bg-[#012f38] hover:bg-[#02434f] text-[#00e5ff] font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-3">
                        <svg class="w-5 h-5 text-[#00e5ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        Bit
                    </button>
                </div>
                <div id="paybox-wrapper" class="hidden flex-col w-full">
                    <button id="paybox-pay-btn" class="w-full bg-[#004fcf] hover:bg-[#003fb3] text-white font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-3">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        PayBox
                    </button>
                </div>
            </div>

            <!-- Highlighted Note (Disclaimer) -->
            <div class="relative z-10 bg-amber-50 border border-amber-200/80 rounded-xl py-2.5 px-3 sm:py-3 sm:px-5 mt-6 mb-2 shadow-sm mx-auto w-fit max-w-full">
                <div class="text-[0.85rem] sm:text-[0.95rem] text-amber-900 font-medium flex flex-row items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap">
                    <span class="text-base sm:text-xl leading-none">💡</span> 
                    <span><strong>חשוב לציין:</strong> השירות הוא ללא עמלה</span>
                </div>
            </div>

            <!-- Waze Button (Moved Here) -->
            <div id="waze-btn-container" class="hidden justify-center my-8 relative z-10">
                <button id="top-waze-btn" class="bg-[#33CCFF] hover:bg-[#2bb8e6] text-white font-bold py-1.5 px-4 rounded-full transition-transform hover:scale-105 shadow-sm border border-white/20 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="text-sm">Waze</span>
                </button>
            </div>

            <!-- Details Content Container (Hidden by Default) -->
            <div id="bank-details" class="hidden space-y-5 relative z-10 border-t border-wedding-gold/20 pt-6 mt-4">
                
                <!-- Beneficiary -->
                <div class="bg-wedding-light/80 p-4 rounded-xl border border-wedding-gold/10 shadow-sm backdrop-blur-sm relative text-center">
                    <p class="text-[10px] text-gray-500 tracking-widest mb-1.5 font-semibold">שם המוטב</p>
                    <div class="flex items-center justify-center gap-2">
                        <p id="display-name" class="font-serif text-2xl text-wedding-dark font-medium italic truncate">טוען...</p>
                        <button id="copy-name-btn" class="p-1.5 text-wedding-gold hover:bg-wedding-gold/10 rounded-md transition-colors shrink-0" title="העתק שם מוטב">
                            <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Bank Info -->
                <div class="bg-wedding-light/80 p-4 rounded-xl border border-wedding-gold/10 shadow-sm backdrop-blur-sm relative text-center">
                    <p class="text-[10px] text-gray-500 tracking-widest mb-1.5 font-semibold">שם הבנק</p>
                    <div class="flex items-center justify-center gap-2">
                        <p id="display-bank" class="text-lg text-wedding-dark font-medium truncate">טוען...</p>
                        <button id="copy-bank-btn" class="p-1.5 text-wedding-gold hover:bg-wedding-gold/10 rounded-md transition-colors shrink-0" title="העתק שם בנק">
                            <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Branch & Account row -->
                <div class="flex flex-col sm:flex-row gap-5">
                    <div class="flex-1 bg-wedding-light/80 p-4 rounded-xl border border-wedding-gold/10 shadow-sm backdrop-blur-sm relative text-center">
                        <p class="text-[10px] text-gray-500 tracking-widest mb-1.5 font-semibold">מספר סניף</p>
                        <div class="flex items-center justify-center gap-2">
                            <p id="display-branch" class="text-lg text-wedding-dark font-semibold font-mono tracking-wider truncate" dir="ltr">---</p>
                            <button id="copy-branch-btn" class="p-1.5 text-wedding-gold hover:bg-wedding-gold/10 rounded-md transition-colors shrink-0" title="העתק מספר סניף">
                                <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex-[2] bg-wedding-light/80 p-4 rounded-xl border border-wedding-gold/10 shadow-sm backdrop-blur-sm relative text-center">
                        <p class="text-[10px] text-gray-500 tracking-widest mb-1.5 font-semibold">מספר חשבון</p>
                        <div class="flex items-center justify-center gap-2">
                        <p id="account-rate-limit-msg" class="hidden text-xs text-red-600 mt-1.5 font-medium"></p>
                            <p id="display-account" class="text-lg text-wedding-dark font-semibold font-mono tracking-wider truncate" dir="ltr">---</p>
                            <button id="copy-account-btn" class="p-1.5 text-wedding-gold hover:bg-wedding-gold/10 rounded-md transition-colors shrink-0" title="הצג מספר חשבון" aria-label="הצג מספר חשבון">
                                <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
                
            </div>

            <!-- Sign-off -->
            <div class="text-center relative z-10 font-sans mt-8 border-t border-wedding-gold/20 pt-6 pb-2">
                <p class="text-[1.05rem] sm:text-lg text-wedding-gold font-semibold">
                    אוהבים 🤍
                </p>
                <p id="footer-couple-names" class="text-lg sm:text-xl text-wedding-dark font-medium mt-1"></p>
            </div>


        </div>
    </div>



    <!-- Bit Confirmation Modal -->
    <div id="bit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl transform transition-all border border-wedding-gold/20 relative" dir="rtl">
            <button id="bit-modal-close-x" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="text-center mb-8 mt-2">
                <h3 class="text-xl md:text-2xl font-semibold text-wedding-dark mb-3">שימו לב</h3>
                <p class="text-lg text-gray-700 font-medium">אנחנו מעדיפים שתבחרו בחשבון הבנק 🙏🏼</p>
            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <button id="modal-bank-btn" class="flex-1 w-full bg-wedding-dark hover:bg-gray-900 text-white font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center border border-transparent">
                    לחשבון הבנק
                </button>
                <button id="modal-bit-proceed-btn" class="flex-1 w-full bg-[#012f38] hover:bg-[#02434f] text-[#00e5ff] font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center">
                    Bit
                </button>
            </div>
        </div>
    </div>

    <!-- PayBox Confirmation Modal -->
    <div id="paybox-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl transform transition-all border border-wedding-gold/20 relative" dir="rtl">
            <button id="paybox-modal-close-x" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="text-center mb-8 mt-2">
                <h3 class="text-xl md:text-2xl font-semibold text-wedding-dark mb-3">שימו לב</h3>
                <p class="text-lg text-gray-700 font-medium">אנחנו מעדיפים שתבחרו בחשבון הבנק 🙏🏼</p>
            </div>
            <div class="flex flex-col md:flex-row gap-4">
                <button id="pb-modal-bank-btn" class="flex-1 w-full bg-wedding-dark hover:bg-gray-900 text-white font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center border border-transparent">
                    לחשבון הבנק
                </button>
                <button id="pb-modal-proceed-btn" class="flex-1 w-full bg-[#004fcf] hover:bg-[#003fb3] text-white font-medium py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center">
                    PayBox
                </button>
            </div>
        </div>
    </div>

    <!-- Guest Payment Page Logic -->
    <script src="frontend/payment.js"></script>
</body>
</html>
